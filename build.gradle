plugins {
	id 'net.neoforged.moddev' version '2.0.141'
	id 'idea'
	id 'maven-publish'
}

version = mod_version
group = mod_group_id

repositories {
	maven { url "https://maven.neoforged.net" }

	// EMI
	maven {
		url "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup("dev.emi")
			includeGroup("com.terraformersmc")
		}
	}

	// REI
	maven {
		url "https://maven.shedaniel.me/"
		content {
			includeGroup("me.shedaniel")
			includeGroup("me.shedaniel.cloth")
			includeGroup("me.shedaniel.cloth.api")
			includeGroup("dev.architectury")
		}
	}

	// JEI
	maven {
		url "https://maven.blamejared.com/"
		content {
			includeGroup("mezz.jei")
		}
	}
}

base {
	archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
	version = project.neoforge_version

	validateAccessTransformers = true

	interfaceInjectionData {
		from file("src/main/resources/META-INF/interfaceinjection.json")
		publish file("src/main/resources/META-INF/interfaceinjection.json")
	}

	runs {
		client {
			client()
		}

		server {
			server()
			programArgument '--nogui'
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			systemProperty 'forge.logging.console.level', 'debug'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	implementation "net.neoforged:neoforge:${neoforge_version}"

	// Recipe viewers
	// compileOnly("mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}")
	// compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}")
	// compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${project.rei_version}")
	// compileOnly("dev.emi:emi-neoforge:${project.emi_version}")
	// compileOnly("dev.emi:emi-neoforge:${project.emi_version}:api")

	switch (project.recipe_viewer) {
		case "jei" -> runtimeOnly("mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}")
			// case "rei" -> runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}")
			// case "emi" -> runtimeOnly("dev.emi:emi-neoforge:${project.emi_version}")
		case "disabled" -> {
		}
		default -> println("Unknown recipe viewer specified: ${project.recipe_viewer}. Must be EMI, REI or disabled.")
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neoforge_version      : neoforge_version,
			neoforge_version_range: neoforge_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description       : mod_description
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			name = "sapphoCompany"
			url = "https://maven.is-immensely.gay/releases"
			credentials {
				username = "dafuqs"
				password = System.getenv("MAVEN_PASS")
			}
		}
	}
}